# The SPA is served from a different origin than the API in development
# (Vite on 5173, the API on 8000), so the browser needs to be told this is
# allowed. Narrowed from the recipe's defaults to what this API actually has:
#
#  - only the methods the route table declares. PATCH and DELETE are not
#    endpoints here, and advertising them invites requests that can only be
#    answered with a 405.
#  - only Content-Type. There is no authentication in this exercise
#    (docs/assumptions.md), so allowing an Authorization header would be
#    describing a system that does not exist.
#  - only /api. Nothing else is served, and a rule scoped to what it protects
#    stays honest when something else appears.
#
# The allowed origins are a regular expression in the environment, defaulting
# to localhost. A deployment sets its own; '*' is never right for an API that
# changes state.
nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'POST', 'PUT', 'OPTIONS']
        allow_headers: ['Content-Type']
        max_age: 3600
    paths:
        '^/api/': null
