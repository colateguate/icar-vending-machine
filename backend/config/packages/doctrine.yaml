doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        use_savepoints: true

        # Custom types, one per value object that owns a column. Registering
        # them here is what lets the mapping say `type="coin_collection"` and
        # get a CoinCollection back — the aggregate never sees a string.
        types:
            machine_id: App\VendingMachine\Infrastructure\Persistence\Doctrine\Type\MachineIdType
            inventory: App\VendingMachine\Infrastructure\Persistence\Doctrine\Type\InventoryType
            coin_collection: App\VendingMachine\Infrastructure\Persistence\Doctrine\Type\CoinCollectionType

    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware

        # No auto_mapping: nothing in src/ is scanned for entities, because
        # scanning is how an ORM attribute ends up in the domain by accident.
        # The one mapped class is declared below, in XML, outside the code.
        auto_mapping: false
        mappings:
            VendingMachine:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/config/doctrine'
                prefix: 'App\VendingMachine\Domain'
                alias: VendingMachine

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
