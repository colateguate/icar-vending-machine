# One origin for the panel and the API, which is the whole reason nginx is here
# rather than a bare static server.
#
# The alternative was to serve the panel on its own origin and widen
# CORS_ALLOW_ORIGIN on the backend to let it through. That works, and it leaves
# every deployment with a second thing to configure correctly and a class of
# failure — a refused preflight — that only ever shows up in a browser. Putting
# both behind one hostname deletes the problem instead of configuring it: the
# panel asks for /api/machine, the browser sees one origin, and CORS never
# enters the conversation. The client was written for this; its base URL is
# relative and httpClient.js says why.

# Cache policy as a lookup rather than as a directive inside each location, and
# that is a workaround for a real nginx trap rather than a flourish: a location
# block that declares any `add_header` of its own **replaces** every header
# inherited from the server, it does not add to them. Written the obvious way —
# Cache-Control per location, security headers once at the top — the security
# headers silently reached no route at all. Measured, not guessed: curl showed
# them missing from /, /index.html and /assets/ alike.
#
# The fix is not to remember to repeat them. It is to leave exactly one place
# that declares headers, so that adding a location tomorrow cannot quietly
# delete them.
map $uri $cache_control {
    # Vite's assets are content-addressed: a change produces a new filename, so
    # the old one can be cached for as long as anyone likes.
    ~^/assets/  "public, max-age=31536000, immutable";
    # Everything else, index.html above all. Cache the document and a browser
    # keeps serving one that points at assets this deployment no longer has.
    default     "no-cache";
}

server {
    # 8080 and not 80 because this runs as an unprivileged user, which cannot
    # bind a port below 1024. Compose publishes it on 3000 either way.
    listen 8080;
    server_name _;

    # Nothing this page loads comes from anywhere else: no font service, no
    # CDN, no analytics, and the bundle carries no inline script or style —
    # checked in the built output rather than assumed, which is what makes a
    # policy this strict safe to declare. `frame-ancestors` is the modern
    # X-Frame-Options and covers it, so that header is not also sent.
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Stops a browser from second-guessing a Content-Type and treating a file
    # as something executable. Free, and unrelated to whether an application
    # has anything worth stealing.
    add_header X-Content-Type-Options "nosniff" always;

    add_header Cache-Control $cache_control always;

    # Everything the API answers, forwarded untouched. proxy_pass carries no
    # URI part on purpose: with none, nginx passes the original path through,
    # so /api/machine arrives as /api/machine instead of being rewritten.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;

        # A single-page app owns its routing, so a path that is not a file is
        # not a 404 — it is a route the bundle knows. There is one screen today,
        # which makes this look like ceremony; it is what stops the first deep
        # link anyone adds from returning nginx's own 404 page.
        try_files $uri $uri/ /index.html;
    }
}
