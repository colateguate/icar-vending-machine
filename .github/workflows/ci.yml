name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  code-style:
    name: Code style (php-cs-fixer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  static-analysis:
    name: Static analysis (PHPStan max)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - run: vendor/bin/phpstan analyse --no-progress

  architecture:
    name: Architecture boundaries (Deptrac)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - run: vendor/bin/deptrac analyse --config-file=deptrac.php --fail-on-uncovered --no-progress

  tests:
    name: Tests (PHPUnit, 4 suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - run: vendor/bin/phpunit

  mutation:
    name: Mutation testing (Infection)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: pcov
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      # Same guard as `make test-mutation`: mutating an empty tree is an error,
      # and the Domain arrives with ticket 04.
      - run: |
          if find src/VendingMachine/Domain src/VendingMachine/Application -name '*.php' | grep -q .; then
            vendor/bin/infection --threads=max --logger-github --no-progress
          else
            echo "No Domain/Application code yet - skipping mutation testing."
          fi
