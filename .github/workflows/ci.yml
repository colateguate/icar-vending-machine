name: CI

on:
  push:
  pull_request:
  # A pipeline triggered only by pushes answers "did this change break
  # anything". The audit job below also has to answer "did the world break
  # us", and the world does not push commits: an advisory is published
  # against a dependency nobody has touched in weeks, and a push-only
  # pipeline would report that risk at the moment least likely to be
  # looking. Weekly, and only on the default branch, which is where the
  # deliverable lives.
  #
  # The whole workflow runs rather than the audit alone. That is nearly free
  # and buys a second thing: the runner image and the Composer that setup-php
  # installs both move underneath us, so a green Monday is also evidence that
  # this still builds on a toolchain nobody pinned.
  #
  # GitHub disables a schedule after 60 days without activity in the
  # repository, so a silent Monday is not proof of anything on its own.
  schedule:
    - cron: '0 6 * * 1'

defaults:
  run:
    working-directory: backend

jobs:
  dependencies:
    name: Dependency advisories (composer audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      # No composer-install step: --locked audits composer.lock, which is
      # what gets deployed, rather than whatever the installer would resolve
      # today. That also makes this the cheapest job in the pipeline, since
      # it never downloads a package.
      #
      # Dev dependencies are audited too. "It never reaches the runtime" is
      # true — the image installs with --no-dev — and it is not the same as
      # "it does not matter": these run in CI, against a checkout, with a
      # token. The cost of that choice is real and is accepted knowingly: an
      # advisory against PHPUnit will block delivery of code that does not
      # use it, and --no-dev is the escape hatch if that day ever arrives.
      #
      # --abandoned is passed rather than inherited. Its default changed
      # between Composer versions (report in 2.6, fail since 2.7) and
      # setup-php installs whatever is newest, so leaving it out means a
      # package being abandoned could redden a security job for a reason
      # that is not security. Nothing in composer.lock is abandoned today;
      # this is preventive and costs one flag.
      #
      # Known limitation, stated rather than hidden: this is the only job
      # whose result depends on an external service, and "Packagist did not
      # answer" arrives looking like "the answer was bad". The schedule is
      # what separates them in practice — a transient failure is green again
      # next Monday, an advisory is still there.
      - run: composer audit --locked --abandoned=report

  code-style:
    name: Code style (php-cs-fixer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  static-analysis:
    name: Static analysis (PHPStan max)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - run: vendor/bin/phpstan analyse --no-progress

  architecture:
    name: Architecture boundaries (Deptrac)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - run: vendor/bin/deptrac analyse --config-file=deptrac.php --fail-on-uncovered --no-progress

  schema:
    name: Schema drift (migration vs mapping)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # The suite and this job both talk to SQLite. It comes with the
          # action by default; naming it means a change in that default fails
          # here rather than in every other job at once.
          extensions: pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      # The mapping and the migration have to describe the same table, and
      # nothing else notices when they stop doing so: the tests build their
      # schema from the mapping, so a migration that drifted would leave them
      # green and break the first real deployment. Same command `make qa` runs.
      - run: |
          DATABASE_URL="sqlite:///%kernel.project_dir%/var/ci-schema.db" php bin/console doctrine:migrations:migrate --no-interaction --quiet
          DATABASE_URL="sqlite:///%kernel.project_dir%/var/ci-schema.db" php bin/console doctrine:schema:validate

  tests:
    name: Tests (PHPUnit, 4 suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - run: vendor/bin/phpunit

  mutation:
    name: Mutation testing (Infection)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: pcov
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      # Same guard as `make test-mutation`: mutating an empty tree is an error,
      # and the Domain arrives with ticket 04.
      - run: |
          if find src/VendingMachine/Domain src/VendingMachine/Application -name '*.php' | grep -q .; then
            vendor/bin/infection --threads=max --logger-github --no-progress
          else
            echo "No Domain/Application code yet - skipping mutation testing."
          fi
      # Escaped mutants are annotated on the diff by --logger-github, but
      # uncovered ones are not: they mean business-core code that no test in
      # the mutated suites executes at all, which is worth naming rather than
      # leaving as a number in a summary.
      - name: Report uncovered mutants
        if: always()
        run: |
          test -f var/infection.log || exit 0
          grep -i -A 40 'not covered' var/infection.log | head -45 || echo 'No uncovered mutants.'
