# The contract of the vending machine API, and — because docs/ is where
# documents go to be believed without being checked — an executable one.
#
# backend/tests/Support/OpenApi/OpenApiContract.php validates every response
# the acceptance suite produces against this file, so the spec cannot drift
# from the API without the build going red.
#
# The examples below are not written from memory either, and that is enforced
# rather than promised: PublishedExamplesTest provokes the exact situation
# each one describes and asserts that the whole document came back. An example
# that stops being a response this API gives fails the build the same way a
# broken schema would.
#
# Every example is published under a name, and no name is used twice for two
# different examples — that is what lets a test address one and what stops a
# second example hiding behind the first.
#
# Two deliberate omissions, both of which make the gate sharper rather than
# the document weaker:
#
#   500 is not documented. It is not a promise this API makes, it is the
#   promise failing, and leaving it undeclared means an unexpected 500 in any
#   acceptance test fails the contract loudly instead of passing it quietly.
#
#   404 for an unknown route and 405 for a method a route does not take are
#   not documented either, because OpenAPI keys everything by declared path
#   and "a path this API never declared" has nowhere to live here. Those two
#   come from the router, not the domain; the tests that probe them say so
#   out loud through requestOutsideTheContract().
#
# Every response object sets additionalProperties: false. Without it a spec
# only notices fields that disappear, which is half of drift.

openapi: 3.1.0

info:
  title: Vending Machine API
  version: "1.0.0"
  summary: Insert coins, buy a product, get your change — or your coins back.
  description: |
    A JSON API over a single vending machine.

    **Money is always a decimal string**, never a JSON number. The machine
    holds amounts as integer cents and IEEE-754 has no exact representation
    for 0.65, so a float on the wire would reintroduce at the boundary the
    error the whole model exists to avoid. Every amount in this document
    matches `^\d+\.\d{2}$`.

    The machine is a singleton: its identity is deployment configuration, not
    something a caller supplies, which is why no path is templated.

    Errors are RFC 7807 `application/problem+json` documents. The status says
    whose problem it is — 422 the value you sent is not valid input, 409 the
    value is valid but conflicts with the machine's current state, 404 you
    named something that does not exist, 400 the body was unreadable, 503 no
    machine has been provisioned yet.
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: The container published by docker-compose.

tags:
  - name: machine
    description: Reading and changing the state of the machine.
  - name: service
    description: What a person refilling the machine does.
  - name: ops
    description: Liveness.

paths:
  /api/health:
    get:
      tags: [ops]
      summary: Liveness probe
      description: |
        Answers "is the kernel up?" and nothing more — it touches no bus and no
        port, so it stays up even when the machine has not been provisioned.
        The container healthcheck depends on it.
      operationId: health
      responses:
        '200':
          description: The kernel is up.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok

  /api/machine:
    get:
      tags: [machine]
      summary: Read the whole machine
      description: |
        The catalogue with its stock, the coins the machine holds as change,
        the coins the customer has inserted and not yet spent, and whether the
        machine is currently unable to give change for everything it sells.
      operationId: getMachineState
      responses:
        '200':
          description: The current state of the machine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineStateResponse'
              examples:
                stocked:
                  summary: A stocked machine with nothing inserted
                  value:
                    machine:
                      products:
                        - { selector: JUICE, name: Juice, price: "1.00", count: 10 }
                        - { selector: SODA, name: Soda, price: "1.50", count: 10 }
                        - { selector: WATER, name: Water, price: "0.65", count: 10 }
                      changeReserve:
                        coins:
                          - { denomination: "0.05", count: 10 }
                          - { denomination: "0.10", count: 10 }
                          - { denomination: "0.25", count: 10 }
                        amount: "4.00"
                      insertedCoins:
                        coins: []
                        amount: "0.00"
                      acceptedCoins:
                        - { denomination: "0.05", dispensableAsChange: true }
                        - { denomination: "0.10", dispensableAsChange: true }
                        - { denomination: "0.25", dispensableAsChange: true }
                        - { denomination: "1.00", dispensableAsChange: false }
                      supportedCoins:
                        - { denomination: "0.05", dispensableAsChange: true, enabled: true }
                        - { denomination: "0.10", dispensableAsChange: true, enabled: true }
                        - { denomination: "0.25", dispensableAsChange: true, enabled: true }
                        - { denomination: "0.50", dispensableAsChange: true, enabled: false }
                        - { denomination: "1.00", dispensableAsChange: false, enabled: true }
                        - { denomination: "2.00", dispensableAsChange: false, enabled: false }
                      exactChangeOnly: false
                      outOfService: false
        '503':
          $ref: '#/components/responses/NotProvisioned'

  /api/machine/coins:
    post:
      tags: [machine]
      summary: Insert one coin
      description: |
        One coin per call, which is how a coin slot works. The coin joins the
        escrow — the machine has not earned it yet, and RETURN-COIN gives it
        back untouched.
      operationId: insertCoin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [coin]
              properties:
                coin:
                  $ref: '#/components/schemas/Denomination'
            example:
              coin: "1.00"
      responses:
        '200':
          description: The coin was accepted and is now in escrow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineStateResponse'
              examples:
                oneEuroInserted:
                  summary: 1.00 inserted into a stocked machine
                  value:
                    machine:
                      products:
                        - { selector: JUICE, name: Juice, price: "1.00", count: 10 }
                        - { selector: SODA, name: Soda, price: "1.50", count: 10 }
                        - { selector: WATER, name: Water, price: "0.65", count: 10 }
                      changeReserve:
                        coins:
                          - { denomination: "0.05", count: 10 }
                          - { denomination: "0.10", count: 10 }
                          - { denomination: "0.25", count: 10 }
                        amount: "4.00"
                      insertedCoins:
                        coins:
                          - { denomination: "1.00", count: 1 }
                        amount: "1.00"
                      acceptedCoins:
                        - { denomination: "0.05", dispensableAsChange: true }
                        - { denomination: "0.10", dispensableAsChange: true }
                        - { denomination: "0.25", dispensableAsChange: true }
                        - { denomination: "1.00", dispensableAsChange: false }
                      supportedCoins:
                        - { denomination: "0.05", dispensableAsChange: true, enabled: true }
                        - { denomination: "0.10", dispensableAsChange: true, enabled: true }
                        - { denomination: "0.25", dispensableAsChange: true, enabled: true }
                        - { denomination: "0.50", dispensableAsChange: true, enabled: false }
                        - { denomination: "1.00", dispensableAsChange: false, enabled: true }
                        - { denomination: "2.00", dispensableAsChange: false, enabled: false }
                      exactChangeOnly: false
                      outOfService: false
        '400':
          $ref: '#/components/responses/MalformedJson'
        '409':
          description: |
            Someone else changed the machine between the read and the write.
            Optimistic locking refused the stale write; nothing was applied.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                concurrentModification:
                  $ref: '#/components/examples/ConcurrentModification'
        '422':
          description: The coin is not one this machine takes, or is not a valid amount at all.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unsupportedCoin:
                  summary: A denomination no machine of this model can read
                  value:
                    type: /problems/unsupported-coin
                    title: Unsupported coin
                    status: 422
                    detail: The machine does not accept coins of 2 cents.
                    code: unsupported_coin
                coinNotAccepted:
                  summary: A readable denomination this machine is switched off for
                  value:
                    type: /problems/coin-not-accepted
                    title: Coin not accepted
                    status: 422
                    detail: This machine is not currently taking 0.50 coins.
                    code: coin_not_accepted
                coinThatIsNotAnAmount:
                  summary: Not a decimal amount
                  value:
                    type: /problems/invalid-money-amount
                    title: Invalid amount
                    status: 422
                    detail: 'Expected a positive decimal amount with at most two decimals, got "a lot".'
                    code: invalid_money_amount
                coinThatIsNotAString:
                  summary: A number where the contract says string — the mistake money is a string to prevent
                  value:
                    type: /problems/invalid-request-payload
                    title: Invalid request payload
                    status: 422
                    detail: 'The field "coin" must be a string.'
                    code: invalid_request_payload
                    field: coin
        '503':
          $ref: '#/components/responses/NotProvisioned'

  /api/machine/coins/return:
    post:
      tags: [machine]
      summary: Give the inserted coins back
      description: |
        The single refund path. It returns the very coins that were inserted,
        not an equivalent amount composed from the reserve, so it can never be
        refused for lack of change.

        The one writing operation with no 400: the button takes no argument,
        so there is no body to fail at reading and an unreadable one is
        ignored rather than refused.
      operationId: returnCoins
      responses:
        '200':
          description: The escrow was emptied into the tray.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnCoinsResponse'
              examples:
                twoDimesBack:
                  summary: 0.20 inserted as two 0.10 coins, returned as the same two coins
                  value:
                    returned:
                      coins:
                        - { denomination: "0.10", count: 2 }
                      amount: "0.20"
                    machine:
                      products:
                        - { selector: JUICE, name: Juice, price: "1.00", count: 10 }
                        - { selector: SODA, name: Soda, price: "1.50", count: 10 }
                        - { selector: WATER, name: Water, price: "0.65", count: 10 }
                      changeReserve:
                        coins:
                          - { denomination: "0.05", count: 10 }
                          - { denomination: "0.10", count: 10 }
                          - { denomination: "0.25", count: 10 }
                        amount: "4.00"
                      insertedCoins:
                        coins: []
                        amount: "0.00"
                      acceptedCoins:
                        - { denomination: "0.05", dispensableAsChange: true }
                        - { denomination: "0.10", dispensableAsChange: true }
                        - { denomination: "0.25", dispensableAsChange: true }
                        - { denomination: "1.00", dispensableAsChange: false }
                      supportedCoins:
                        - { denomination: "0.05", dispensableAsChange: true, enabled: true }
                        - { denomination: "0.10", dispensableAsChange: true, enabled: true }
                        - { denomination: "0.25", dispensableAsChange: true, enabled: true }
                        - { denomination: "0.50", dispensableAsChange: true, enabled: false }
                        - { denomination: "1.00", dispensableAsChange: false, enabled: true }
                        - { denomination: "2.00", dispensableAsChange: false, enabled: false }
                      exactChangeOnly: false
                      outOfService: false
        '409':
          description: A concurrent change was refused by optimistic locking.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                concurrentModification:
                  $ref: '#/components/examples/ConcurrentModification'
        '503':
          $ref: '#/components/responses/NotProvisioned'

  /api/machine/purchases:
    post:
      tags: [machine]
      summary: Buy a product
      description: |
        Plural, because a purchase is something that happened rather than a
        procedure being called.

        The one operation where stock, the coin reserve and the escrow have to
        agree at the same instant: the product leaves the slot if and only if
        its price is covered **and** the exact change can be composed from
        coins physically inside the machine. When it cannot, the sale is
        refused with 409 `exact_change_required` and the coins stay in escrow,
        where returning them is still one call away.
      operationId: purchaseProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [selector]
              properties:
                selector:
                  $ref: '#/components/schemas/Selector'
            example:
              selector: SODA
      responses:
        '200':
          description: The product was dispensed, with change if any was due.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
              examples:
                exactMoney:
                  summary: A 1.50 soda paid with exactly 1.50 — no change due
                  value:
                    dispensed:
                      selector: SODA
                      name: Soda
                      price: "1.50"
                      change:
                        coins: []
                        amount: "0.00"
                    machine:
                      products:
                        - { selector: JUICE, name: Juice, price: "1.00", count: 10 }
                        - { selector: SODA, name: Soda, price: "1.50", count: 9 }
                        - { selector: WATER, name: Water, price: "0.65", count: 10 }
                      changeReserve:
                        coins:
                          - { denomination: "0.05", count: 10 }
                          - { denomination: "0.10", count: 10 }
                          - { denomination: "0.25", count: 12 }
                          - { denomination: "1.00", count: 1 }
                        amount: "5.50"
                      insertedCoins:
                        coins: []
                        amount: "0.00"
                      acceptedCoins:
                        - { denomination: "0.05", dispensableAsChange: true }
                        - { denomination: "0.10", dispensableAsChange: true }
                        - { denomination: "0.25", dispensableAsChange: true }
                        - { denomination: "1.00", dispensableAsChange: false }
                      supportedCoins:
                        - { denomination: "0.05", dispensableAsChange: true, enabled: true }
                        - { denomination: "0.10", dispensableAsChange: true, enabled: true }
                        - { denomination: "0.25", dispensableAsChange: true, enabled: true }
                        - { denomination: "0.50", dispensableAsChange: true, enabled: false }
                        - { denomination: "1.00", dispensableAsChange: false, enabled: true }
                        - { denomination: "2.00", dispensableAsChange: false, enabled: false }
                      exactChangeOnly: false
                      outOfService: false
        '400':
          $ref: '#/components/responses/MalformedJson'
        '404':
          description: This machine stocks no product under that selector.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unknownProduct:
                  summary: The caller asked for SODA and there is no SODA
                  value:
                    type: /problems/unknown-product
                    title: Unknown product
                    status: 404
                    detail: 'This machine does not stock any product under the selector "SODA".'
                    code: unknown_product
        '409':
          description: |
            The selector is valid, but the machine's current state refuses the
            sale: not enough money in, nothing left in the slot, no way to
            compose the change, or a concurrent write.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                insufficientFunds:
                  summary: Not enough inserted yet — the shortfall is in the document
                  value:
                    type: /problems/insufficient-funds
                    title: Insufficient funds
                    status: 409
                    detail: Another 0.40 is needed before this product can be dispensed.
                    code: insufficient_funds
                    missingAmount: "0.40"
                productOutOfStock:
                  summary: The slot is empty
                  value:
                    type: /problems/product-out-of-stock
                    title: Product sold out
                    status: 409
                    detail: 'The product "WATER" is sold out.'
                    code: product_out_of_stock
                exactChangeRequired:
                  summary: The sale is refused rather than shortchanging anyone; the coins stay in escrow
                  value:
                    type: /problems/exact-change-required
                    title: Exact change required
                    status: 409
                    detail: The machine cannot compose 0.35 in change from the coins it holds.
                    code: exact_change_required
                    changeDue: "0.35"
                concurrentModification:
                  $ref: '#/components/examples/ConcurrentModification'
        '422':
          description: The selector is not a well-formed selector, or the body does not carry one.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                selectorInLowercase:
                  summary: Lowercase is not a selector
                  value:
                    type: /problems/invalid-product-selector
                    title: Invalid product selector
                    status: 422
                    detail: 'A product selector must match /^[A-Z][A-Z0-9_-]{0,31}$/, got "water".'
                    code: invalid_product_selector
                missingSelector:
                  summary: The field is absent, and the document names it
                  value:
                    type: /problems/invalid-request-payload
                    title: Invalid request payload
                    status: 422
                    detail: 'The field "selector" is required.'
                    code: invalid_request_payload
                    field: selector
        '503':
          $ref: '#/components/responses/NotProvisioned'

  /api/machine/service:
    put:
      tags: [service]
      summary: Set what the machine stocks and holds
      description: |
        A service visit: what is in the slots and what is in the till after the
        person with the key leaves.

        PUT rather than POST because it states the result rather than requests
        a change — sending it twice leaves the same machine. It services a
        machine that already exists; creating one is what `app:machine:provision`
        is for, which is why an unprovisioned machine answers 503 here too.

        The escrow is not part of a service visit: a customer's coins are not
        the operator's to set.
      operationId: serviceMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [products, changeReserve]
              properties:
                products:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [selector, name, price, count]
                    properties:
                      selector:
                        $ref: '#/components/schemas/Selector'
                      name:
                        type: string
                        minLength: 1
                      price:
                        $ref: '#/components/schemas/Money'
                      count:
                        type: integer
                        minimum: 0
                changeReserve:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [denomination, count]
                    properties:
                      denomination:
                        $ref: '#/components/schemas/Denomination'
                      count:
                        type: integer
                        minimum: 0
                acceptedCoins:
                  type: array
                  description: |
                    Which denominations the machine takes from now on. A set,
                    so it travels as amounts rather than as a flag on the till
                    rows: that list says how many coins are in there, this one
                    says which the slot will read, and a denomination can be in
                    either without the other. Money left inside when its
                    denomination is switched off appears as exactly that — a
                    row in `changeReserve` that is not in this list.

                    Omit the field and the visit leaves the acceptor alone.
                    Send an empty list and the machine takes nothing at all,
                    which is a machine out of service — a state a technician is
                    allowed to leave behind.

                    Naming a denomination twice is read rather than refused: a
                    set holds it once however many times you say it. A repeated
                    `changeReserve` row is refused instead, because there the
                    duplicate is ambiguous.
                  items:
                    $ref: '#/components/schemas/Denomination'
            example:
              products:
                - { selector: TEA, name: Iced Tea, price: "0.80", count: 4 }
              changeReserve:
                - { denomination: "0.25", count: 2 }
              acceptedCoins: ["0.25", "0.50", "1.00"]
      responses:
        '200':
          description: The machine now stocks and holds what was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineStateResponse'
              examples:
                oneProductOneCoin:
                  summary: A machine serviced down to one product and two quarters
                  value:
                    machine:
                      products:
                        - { selector: TEA, name: Iced Tea, price: "0.80", count: 4 }
                      changeReserve:
                        coins:
                          - { denomination: "0.25", count: 2 }
                        amount: "0.50"
                      insertedCoins:
                        coins: []
                        amount: "0.00"
                      acceptedCoins:
                        - { denomination: "0.05", dispensableAsChange: true }
                        - { denomination: "0.10", dispensableAsChange: true }
                        - { denomination: "0.25", dispensableAsChange: true }
                        - { denomination: "1.00", dispensableAsChange: false }
                      supportedCoins:
                        - { denomination: "0.05", dispensableAsChange: true, enabled: true }
                        - { denomination: "0.10", dispensableAsChange: true, enabled: true }
                        - { denomination: "0.25", dispensableAsChange: true, enabled: true }
                        - { denomination: "0.50", dispensableAsChange: true, enabled: false }
                        - { denomination: "1.00", dispensableAsChange: false, enabled: true }
                        - { denomination: "2.00", dispensableAsChange: false, enabled: false }
                      exactChangeOnly: false
                      outOfService: false
        '400':
          $ref: '#/components/responses/MalformedJson'
        '409':
          description: A concurrent change was refused by optimistic locking.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                concurrentModification:
                  $ref: '#/components/examples/ConcurrentModification'
        '422':
          description: |
            Something in the payload is not valid input. Nothing is applied —
            a refused service visit leaves the machine exactly as it was.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                missingProducts:
                  summary: A required field is absent
                  value:
                    type: /problems/invalid-request-payload
                    title: Invalid request payload
                    status: 422
                    detail: 'The field "products" is required.'
                    code: invalid_request_payload
                    field: products
                selectorWithASpace:
                  summary: A selector with a space in it
                  value:
                    type: /problems/invalid-product-selector
                    title: Invalid product selector
                    status: 422
                    detail: 'A product selector must match /^[A-Z][A-Z0-9_-]{0,31}$/, got "iced tea".'
                    code: invalid_product_selector
                priceThatIsNotAnAmount:
                  summary: A price that is not an amount
                  value:
                    type: /problems/invalid-money-amount
                    title: Invalid amount
                    status: 422
                    detail: 'Expected a positive decimal amount with at most two decimals, got "free".'
                    code: invalid_money_amount
                unsupportedCoin:
                  summary: A denomination the machine cannot hold
                  value:
                    type: /problems/unsupported-coin
                    title: Unsupported coin
                    status: 422
                    detail: The machine does not accept coins of 2 cents.
                    code: unsupported_coin
        '503':
          $ref: '#/components/responses/NotProvisioned'

components:
  schemas:
    Money:
      type: string
      pattern: '^\d+\.\d{2}$'
      description: |
        An amount, as a decimal string with exactly two decimals. Never a JSON
        number: the machine works in integer cents, and a float would lose at
        the boundary the exactness the model is built on.
      examples: ["0.65", "1.50", "0.00"]

    Denomination:
      type: string
      enum: ["0.05", "0.10", "0.25", "0.50", "1.00", "2.00"]
      description: |
        Every coin the acceptor can read. Which of them a given machine takes
        is a different question, answered by `acceptedCoins` and settable by a
        service visit — a machine installed from the brief takes four of these
        six.

        The big pieces go in and never come out of the change chute: that is
        the brief's rule for the 1.00, read one denomination further up for the
        2.00, and it is recorded in the assumptions document.

    Selector:
      type: string
      pattern: '^[A-Z][A-Z0-9_-]{0,31}$'
      description: The code printed next to the slot. Uppercase, up to 32 characters.
      examples: [WATER, JUICE, SODA]

    Coin:
      type: object
      additionalProperties: false
      required: [denomination, count]
      properties:
        denomination:
          $ref: '#/components/schemas/Denomination'
        count:
          type: integer
          minimum: 1

    AcceptedCoin:
      type: object
      additionalProperties: false
      required: [denomination, dispensableAsChange]
      properties:
        denomination:
          $ref: '#/components/schemas/Denomination'
        dispensableAsChange:
          type: boolean
          description: |
            Whether this coin can come back out of the change chute. The
            brief's rule for the 1.00 — it goes in and never comes back —
            extends to the 2.00 by the same reading; the smaller pieces are
            all dispensable. Stated here rather than left to be inferred.

            Loading a coin that is not dispensable into the reserve therefore
            does nothing for change-making, and a service screen worth its salt
            says so before someone does it.

    SupportedCoin:
      type: object
      additionalProperties: false
      required: [denomination, dispensableAsChange, enabled]
      description: |
        A denomination the acceptor can read, and what this machine does with
        it.
      properties:
        denomination:
          $ref: '#/components/schemas/Denomination'
        dispensableAsChange:
          type: boolean
          description: Whether this coin can come back out of the change chute.
        enabled:
          type: boolean
          description: |
            Whether this machine is currently taking the coin. Switched by a
            service visit; a coin that is off is refused at the slot with
            `coin_not_accepted`, and any of it left in the till stays there
            without ever being given back as change.

    CoinBag:
      type: object
      additionalProperties: false
      required: [coins, amount]
      description: |
        A set of coins and what they add up to. The total is sent alongside so
        a client never has to do money arithmetic to display it. Coins are
        ordered by ascending denomination, and a denomination with no coins is
        absent rather than present with a zero.
      properties:
        coins:
          type: array
          items:
            $ref: '#/components/schemas/Coin'
        amount:
          $ref: '#/components/schemas/Money'

    Product:
      type: object
      additionalProperties: false
      required: [selector, name, price, count]
      properties:
        selector:
          $ref: '#/components/schemas/Selector'
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        count:
          type: integer
          minimum: 0
          description: How many are left in the slot.

    MachineState:
      type: object
      additionalProperties: false
      required: [products, changeReserve, insertedCoins, acceptedCoins, supportedCoins, exactChangeOnly, outOfService]
      properties:
        products:
          type: array
          description: The catalogue, ordered by selector.
          items:
            $ref: '#/components/schemas/Product'
        changeReserve:
          $ref: '#/components/schemas/CoinBag'
        insertedCoins:
          $ref: '#/components/schemas/CoinBag'
        acceptedCoins:
          type: array
          description: |
            Which coins the slot takes, smallest first — a different question
            from `changeReserve`, which is what the machine currently holds.
            An empty till changes nothing about what the slot accepts: that is
            set by the last service visit, not by what is left inside.

            It is published so a client does not have to carry the list itself.
            The same goes for `dispensableAsChange`: that the 1.00 coin goes in
            and never comes back is an interpretation of the brief, and a rule
            reimplemented on the far side of a network is a rule two systems
            will eventually disagree about.
          items:
            $ref: '#/components/schemas/AcceptedCoin'
        supportedCoins:
          type: array
          description: |
            Every denomination the acceptor can read, and whether this machine
            is taking it. `acceptedCoins` is exactly the enabled subset — the
            two are views of one fact and never disagree.

            Both are published because they answer different questions. A
            customer asks what may go in the slot; a technician asks what the
            hardware could take and what is currently switched off, and only
            this list can show a coin the machine is refusing.
          items:
            $ref: '#/components/schemas/SupportedCoin'
        exactChangeOnly:
          type: boolean
          description: |
            True when the machine cannot currently give change for every
            product it sells. A physical machine lights a lamp; this is the
            lamp.
        outOfService:
          type: boolean
          description: |
            True when the machine takes no coin at all. Nobody can build up an
            escrow, so nothing can be bought: it is what a technician leaves
            behind by switching every denomination off.

            Derivable from an empty `acceptedCoins`, and published anyway for
            the same reason `exactChangeOnly` is — a rule a client has to
            reimplement is a rule two systems will eventually disagree about.

    MachineStateResponse:
      type: object
      additionalProperties: false
      required: [machine]
      properties:
        machine:
          $ref: '#/components/schemas/MachineState'

    Dispensed:
      type: object
      additionalProperties: false
      required: [selector, name, price, change]
      description: What fell into the tray.
      properties:
        selector:
          $ref: '#/components/schemas/Selector'
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        change:
          $ref: '#/components/schemas/CoinBag'

    PurchaseResponse:
      type: object
      additionalProperties: false
      required: [dispensed, machine]
      description: |
        Both halves of the answer: what physically left the machine, and what
        the machine looks like now. The first cannot be recovered by a later
        query — the coins and the can are gone — which is why this command
        returns anything at all.
      properties:
        dispensed:
          $ref: '#/components/schemas/Dispensed'
        machine:
          $ref: '#/components/schemas/MachineState'

    ReturnCoinsResponse:
      type: object
      additionalProperties: false
      required: [returned, machine]
      properties:
        returned:
          $ref: '#/components/schemas/CoinBag'
        machine:
          $ref: '#/components/schemas/MachineState'

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code]
      description: |
        An RFC 7807 problem document. `code` is this API's own addition: a
        stable machine-readable name, so a client branches on a string instead
        of parsing English out of `detail`.

        The optional members are extensions that only some problems carry,
        each putting a number the caller needs into the document rather than
        only into the sentence.
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI reference naming the problem type.
          examples: ["/problems/exact-change-required"]
        title:
          type: string
          description: A short, human-readable summary. The same for every occurrence of a type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status, repeated inside the document as RFC 7807 asks.
        detail:
          type: string
          description: |
            What went wrong this time. Written for a person. Anything the
            domain did not anticipate is answered with a 500 whose detail is
            suppressed, so this never leaks an internal message.
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: The stable name of the failure. Branch on this.
        changeDue:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: On `exact_change_required` — the change the machine could not compose.
        missingAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: On `insufficient_funds` — how much more the customer needs to insert.
        field:
          type: string
          description: On `invalid_request_payload` — the field of the request body at fault.

  examples:
    ConcurrentModification:
      summary: Two callers, one machine — the stale write loses
      value:
        type: /problems/concurrent-modification
        title: The machine changed underneath you
        status: 409
        detail: 'The machine "lobby-01" was changed by someone else while this request was being handled.'
        code: concurrent_modification

  responses:
    NotProvisioned:
      description: |
        No machine has been provisioned in this deployment yet.

        Not a 404: the caller named nothing — the route is the singleton
        /api/machine — and the fault is ours, so the honest answer is "not
        ready yet" rather than "you asked for something that does not exist".
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notProvisioned:
              summary: Nothing was named wrong; this deployment has no machine
              value:
                type: /problems/machine-not-provisioned
                title: Machine not provisioned
                status: 503
                detail: 'No machine has been provisioned under the id "lobby-01".'
                code: machine_not_provisioned

    MalformedJson:
      description: The request body is not JSON at all, so no field-level complaint is possible.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            bodyThatIsNotJson:
              summary: The bytes never parsed, so no field can be blamed
              value:
                type: /problems/malformed-json
                title: Malformed JSON body
                status: 400
                detail: The request body is not valid JSON.
                code: malformed_json
